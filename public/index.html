<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<link rel="stylesheet" href="/public/css/style.css">
</head>

<body>

<div class="app" id="app">
  <div class="screen-stack">
    <section class="screen" id="screen-home" data-screen="home">
      <header class="subnav">
        <button class="subnav-tab is-active" data-subtab="feed" type="button">ホーム</button>
        <button class="subnav-tab" data-subtab="ranking" type="button">ランキング</button>
      </header>
      <div class="period-pills is-hidden" id="periodPills">
        <button class="pill is-active" data-period="daily" type="button">日間</button>
        <button class="pill" data-period="weekly" type="button">週間</button>
        <button class="pill" data-period="monthly" type="button">月間</button>
        <button class="pill" data-period="total" type="button">総合</button>
      </div>
      <div class="plot-list" id="plotList"></div>
    </section>
    <section class="screen is-hidden" id="screen-chat" data-screen="chat">
      <header class="screen-header"><h1>チャット</h1></header>
      <div class="history-list" id="historyList"></div>
    </section>
    <section class="screen is-hidden" id="screen-create" data-screen="create">
      <header class="screen-header"><h1>作成</h1></header>
      <div class="stub-screen">
        <div class="stub-icon">✏️</div>
        <p class="stub-title">プロット作成</p>
        <p class="stub-desc">これから実装します。<br>もう少しだけお待ちください。</p>
      </div>
    </section>
    <section class="screen is-hidden" id="screen-account" data-screen="account">
      <header class="screen-header"><h1>アカウント</h1></header>
      <div class="stub-screen">
        <div class="stub-icon">👤</div>
        <p class="stub-title">アカウント</p>
        <p class="stub-desc">これから実装します。<br>もう少しだけお待ちください。</p>
      </div>
    </section>
    <section class="screen screen-room is-hidden" id="screen-room" data-screen="room">
      <header class="header">
        <button class="back-button" id="backButton" type="button" aria-label="戻る">‹</button>
        <div class="profile-icon" id="roomAvatar">AI</div>
        <div class="header-info">
          <div class="header-name" id="roomName">AI Chat</div>
          <div class="header-status">オンライン</div>
        </div>
      </header>
      <main class="chat" id="chat"></main>
      <div class="input-area">
        <input
          id="messageInput"
          class="input-box"
          type="text"
          placeholder="メッセージを入力..."
          autocomplete="off"
        >
        <button id="sendButton" class="send-button" type="button">➤</button>
      </div>
    </section>
  </div>
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-tab is-active" data-tab="home" type="button">
      <span class="nav-icon">🏠</span><span class="nav-label">ホーム</span>
    </button>
    <button class="nav-tab" data-tab="chat" type="button">
      <span class="nav-icon">💬</span><span class="nav-label">チャット</span>
    </button>
    <button class="nav-tab" data-tab="create" type="button">
      <span class="nav-icon">✏️</span><span class="nav-label">作成</span>
    </button>
    <button class="nav-tab" data-tab="account" type="button">
      <span class="nav-icon">👤</span><span class="nav-label">アカウント</span>
    </button>
  </nav>
</div>

<script src="/public/js/app.js"></script>
</body>
</html>
